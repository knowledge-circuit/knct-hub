[tool.bumpversion]
current_version = "0.1.1"
commit = true
tag = true
tag_name = "cli-v{new_version}"
message = "chore: bump cli to cli-v{new_version}"
allow_dirty = false

[[tool.bumpversion.files]]
filename = "package.json"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'
